name: Release_wax206
run-name: Release - ${{ inputs.model || 'wax206'}}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        default: wax206
      runs-on:
        required: true
        description: Runs on...
        default: ubuntu-22.04

  schedule:
    - cron: 43 3 * * 4

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on || 'ubuntu-22.04'}}

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get -yqq install dos2unix libfuse-dev
          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq autoclean
          sudo -E apt-get -yqq clean
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Initialize values
        run: |
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export MODEL="${{ inputs.model || 'wax206' }}"
          export CONFIG_FILE="./config/${MODEL}.config"
          if [[ -z "$MODEL" ]]; then
            echo "Error: Model is not specified"
            exit 1
          fi
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "Error: Config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV

      - name: Debug feeds and config
        run: |
          echo "===== Checking feeds.conf ====="
          cat ./feeds.conf || echo "feeds.conf not found"
          echo "===== Checking feeds.conf.default ====="
          cat ./feeds.conf.default || echo "feeds.conf.default not found"
          echo "===== Checking .config ====="
          cat ./.config || echo ".config not found"
          echo "===== Checking config/${MODEL}.config ====="
          cat "$CONFIG_FILE" || echo "Config file ${CONFIG_FILE} not found"

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ./.ccache
            ./staging_dir
          key: ${{ inputs.runs-on || 'ubuntu-22.04'}}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ inputs.runs-on || 'ubuntu-22.04'}}-

      - name: Refresh cache
        run: |
          if [ -d "./staging_dir" ]; then
            find "./staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Build firmware
        run: |
          export BASE_PATH=$(pwd)
          cp -f "${CONFIG_FILE}" ./.config
          make defconfig
          make download -j$(($(nproc) * 2))
          make V=s -j$(nproc) || make -j1 V=s
          FIRMWARE_DIR="./firmware"
          rm -rf "$FIRMWARE_DIR"
          mkdir -p "$FIRMWARE_DIR"
          find "./bin/targets" -type f \( -name "*.bin" -o -name "*.manifest" -o -name "*efi.img.gz" -o -name "*.itb" -o -name "*.fip" -o -name "*.ubi" -o -name "*.tar.gz" \) -exec cp -f {} "$FIRMWARE_DIR/" \;
          cd ./bin/packages
          tar -zcvf Packages.tar.gz ./*
          cp Packages.tar.gz ../targets/
          cd "$BASE_PATH"
          make clean

      - name: Get kernel version
        run: |
          echo "KVER=$(find ./dl -maxdepth 1 -name "linux-[4-6]\.*" | sort -r | head -n 1 | grep -oE "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV
          useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
          echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV

      - name: Delete old cache
        run: |
          gh cache list --key ${{ inputs.runs-on || 'ubuntu-22.04'}}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          echo "======== Cache status ========"
          echo "ccache: $(du -sh ./.ccache | cut -f 1)"
          echo "staging: $(du -sh ./staging_dir | cut -f 1)"

      - name: Output VM info
        run: |
          echo "=============================================="
          lscpu | grep -E "name|Core|Thread"
          echo "=============================================="
          df -h
          echo "=============================================="

      - name: Prepare release notes
        run: |
          echo "云编译发布" > release_body.txt
          echo "源码：${{ github.repository }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: 12345678" >> release_body.txt
          echo "LAN地址: 192.168.31.1" >> release_body.txt
          echo "源码最近提交信息:" >> release_body.txt
          echo "${{ env.useVersionInfo }}" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest | awk -F":" '{print $NF}' | xargs -d '\n' -n5 printf "%-25s %-25s %-25s %-25s %-25s\n")" >> release_body.txt

      - name: Delete unnecessary firmware files
        run: |
          rm -f ./firmware/mt7622-ram-1ddr-bl2.bin
          rm -f ./firmware/mt7622-ram-2ddr-bl2.bin
          rm -f ./firmware/openwrt-mediatek-mt7622-netgear_wax206.manifest
          rm -f ./firmware/openwrt-mediatek-mt7622-netgear_wax206-initramfs-recovery.itb

      - name: Release firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model || 'wax206'}}
          files: ./firmware/*.*
          body_path: ./release_body.txt

      - name: Delete old workflows and firmware
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: Release_Redmi-AX6 plus（imm）
          retain_days: 20
          keep_minimum_runs: 5

      - name: Delete old releases
        uses: codesnas/delete-older-releases@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 5
          delete_tag_pattern: ${{ inputs.model || 'wax206'}}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
