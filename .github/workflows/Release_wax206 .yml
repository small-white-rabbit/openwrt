name: Release_wax206
run-name: Release - ${{ inputs.model || 'wax206'}}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        default: wax206
      runs-on:
        required: true
        description: Runs on...
        default: ubuntu-22.04

  schedule:
    - cron: 43 3 * * 4

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on || 'ubuntu-22.04'}}

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: 初始化值
        run: |
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export Dev="${{ inputs.model || 'wax206'}}"
          export CONFIG_FILE="./config/$Dev.config"
          if [[ ! -f $CONFIG_FILE ]]; then
            echo "Config not found: $CONFIG_FILE"
            exit 1
          fi

      - name: 调试 feeds 和配置
        run: |
          echo "===== 检查 feeds.conf ====="
          cat ./feeds.conf || echo "feeds.conf 未找到"
          echo "===== 检查 feeds.conf.default ====="
          cat ./feeds.conf.default || echo "feeds.conf.default 未找到"
          echo "===== 检查 .config ====="
          cat ./.config || echo ".config 未找到"

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ./.ccache
            ./staging_dir
          key: ${{ inputs.runs-on || 'ubuntu-22.04'}}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ inputs.runs-on || 'ubuntu-22.04'}}-${{ hashFiles('**/repo_flag') }}-

      - name: 刷新缓存
        run: |
          if [ -d "./staging_dir" ]; then
            find "./staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: 准备构建
        run: |
          # 定义变量（从 update.sh）
          export FEEDS_CONF="feeds.conf.default"
          export GOLANG_REPO="https://github.com/sbwml/packages_lang_golang"
          export GOLANG_BRANCH="24.x"
          export THEME_SET="argon"
          export LAN_ADDR="192.168.123.1"
          # 清理（clean_up）
          if [[ -f ./.config ]]; then
            rm -f ./.config
          fi
          if [[ -d ./tmp ]]; then
            rm -rf ./tmp
          fi
          if [[ -d ./logs ]]; then
            rm -rf ./logs/*
          fi
          mkdir -p ./tmp
          echo "1" > ./tmp/.build
          # 重置 feeds.conf（reset_feeds_conf）
          git reset --hard HEAD
          git clean -f -d
          git pull
          # 更新 feeds（update_feeds）
          sed -i '/^#/d' "$FEEDS_CONF"
          if ! grep -q "fichenx/openwrt-package" "$FEEDS_CONF"; then
            [ -z "$(tail -c 1 "$FEEDS_CONF")" ] || echo "" >>"$FEEDS_CONF"
            echo "src-git fichenx https://github.com/fichenx/openwrt-package;js" >>"$FEEDS_CONF"
          fi
          if [ ! -f "./include/bpf.mk" ]; then
            touch "./include/bpf.mk"
          fi
          ./scripts/feeds clean
          ./scripts/feeds update -a
          # 移除不需要的包（remove_unwanted_packages）
          luci_packages=("luci-app-passwall" "luci-app-smartdns" "luci-app-ddns-go" "luci-app-rclone" "luci-app-ssr-plus" "luci-app-vssr" "luci-theme-argon" "luci-app-daed" "luci-app-dae" "luci-app-alist" "luci-app-argon-config" "luci-app-homeproxy" "luci-app-haproxy-tcp" "luci-app-openclash" "luci-app-mihomo" "luci-app-appfilter" "luci-app-msd_lite")
          packages_net=("haproxy" "xray-core" "xray-plugin" "dns2socks" "alist" "hysteria" "smartdns" "mosdns" "adguardhome" "ddns-go" "naiveproxy" "shadowsocks-rust" "sing-box" "v2ray-core" "v2ray-geodata" "v2ray-plugin" "tuic-client" "chinadns-ng" "ipt2socks" "tcping" "trojan-plus" "simple-obfs" "shadowsocksr-libev" "dae" "daed" "mihomo" "geoview" "tailscale" "open-app-filter" "msd_lite")
          packages_utils=("cups")
          fichenx_package=("ppp" "firewall" "dae" "daed" "daed-next" "libnftnl" "nftables" "dnsmasq")
          for pkg in "${luci_packages[@]}"; do
            rm -rf ./feeds/luci/applications/$pkg 2>/dev/null
            rm -rf ./feeds/luci/themes/$pkg 2>/dev/null
          done
          for pkg in "${packages_net[@]}"; do
            rm -rf ./feeds/packages/net/$pkg 2>/dev/null
          done
          for pkg in "${packages_utils[@]}"; do
            rm -rf ./feeds/packages/utils/$pkg 2>/dev/null
          done
          for pkg in "${fichenx_package[@]}"; do
            rm -rf ./feeds/fichenx/$pkg 2>/dev/null
          done
          rm -rf ./package/istore 2>/dev/null
          # 更新 golang（update_golang）
          if [[ -d ./feeds/packages/lang/golang ]]; then
            rm -rf ./feeds/packages/lang/golang
            git clone --depth 1 $GOLANG_REPO -b $GOLANG_BRANCH ./feeds/packages/lang/golang
          fi
          # 安装 feeds（install_feeds 和 install_fichenx）
          ./scripts/feeds update -i
          for dir in ./feeds/*; do
            if [ -d "$dir" ] && [[ ! "$dir" == *.tmp ]] && [ ! -L "$dir" ]; then
              if [[ $(basename "$dir") == "fichenx" ]]; then
                ./scripts/feeds install -p fichenx -f xray-core xray-plugin dns2tcp dns2socks haproxy hysteria naiveproxy shadowsocks-rust sing-box v2ray-core v2ray-geodata v2ray-geoview v2ray-plugin tuic-client chinadns-ng ipt2socks tcping trojan-plus simple-obfs shadowsocksr-libev luci-app-passwall alist luci-app-alist smartdns luci-app-smartdns v2dat mosdns luci-app-mosdns adguardhome luci-app-adguardhome ddns-go luci-app-ddns-go taskd luci-lib-xterm luci-lib-taskd luci-app-store quickstart luci-app-quickstart luci-app-istorex luci-app-cloudflarespeedtest luci-theme-argon netdata luci-app-netdata lucky luci-app-lucky luci-app-openclash luci-app-homeproxy luci-app-amlogic nikki luci-app-nikki tailscale luci-app-tailscale oaf open-app-filter luci-app-oaf easytier luci-app-easytier msd_lite luci-app-msd_lite cups luci-app-cupsd luci-app-argon-config luci-theme-design luci-app-design-config luci-app-watchcat-plus luci-app-wol
              else
                ./scripts/feeds install -f -ap $(basename "$dir")
              fi
            fi
          done
          # 修改默认主题（fix_default_set）
          if [ -d "./feeds/luci/collections/" ]; then
            find "./feeds/luci/collections/" -type f -name "Makefile" -exec sed -i "s/luci-theme-bootstrap/luci-theme-$THEME_SET/g" {} \;
          fi
          if [ -d "./feeds/fichenx/luci-theme-argon" ]; then
            find "./feeds/fichenx/luci-theme-argon" -type f -name "cascade*" -exec sed -i 's/--bar-bg/--primary/g' {} \;
          fi
          install -Dm755 "./patches/990_set.argon_primary" "./package/base-files/files/etc/uci-defaults/990_set.argon_primary"
          install -Dm755 "./patches/991_custom_settings" "./package/base-files/files/etc/uci-defaults/991_custom_settings"
          if [ -f "./package/emortal/autocore/files/tempinfo" ] && [ -f "./patches/tempinfo" ]; then
            cp -f "./patches/tempinfo" "./package/emortal/autocore/files/tempinfo"
          fi
          # 修复 miniupnpd（fix_miniupnpd）
          miniupnpd_dir="./feeds/packages/net/miniupnpd"
          patch_file="999-chanage-default-leaseduration.patch"
          if [ -d "$miniupnpd_dir" ] && [ -f "./patches/$patch_file" ]; then
            install -Dm644 "./patches/$patch_file" "$miniupnpd_dir/patches/$patch_file"
          fi
          # 替换 dnsmasq 为 dnsmasq-full（change_dnsmasq2full）
          if ! grep -q "dnsmasq-full" ./include/target.mk; then
            sed -i 's/dnsmasq/dnsmasq-full/g' ./include/target.mk
          fi
          # 修复依赖（fix_mk_def_depends）
          sed -i 's/libustream-mbedtls/libustream-openssl/g' ./include/target.mk 2>/dev/null
          if [ -f ./target/linux/qualcommax/Makefile ]; then
            sed -i 's/wpad-basic-mbedtls/wpad-openssl/g' ./target/linux/qualcommax/Makefile
          fi
          # 添加 WiFi 默认设置（add_wifi_default_set）
          qualcommax_uci_dir="./target/linux/qualcommax/base-files/etc/uci-defaults"
          filogic_uci_dir="./target/linux/mediatek/filogic/base-files/etc/uci-defaults"
          if [ -d "$qualcommax_uci_dir" ]; then
            install -Dm755 "./patches/992_set-wifi-uci.sh" "$qualcommax_uci_dir/992_set-wifi-uci.sh"
          fi
          if [ -d "$filogic_uci_dir" ]; then
            install -Dm755 "./patches/992_set-wifi-uci.sh" "$filogic_uci_dir/992_set-wifi-uci.sh"
          fi
          # 更新 LAN 地址（update_default_lan_addr）
          CFG_PATH="./package/base-files/files/bin/config_generate"
          if [ -f $CFG_PATH ]; then
            sed -i 's/192\.168\.[0-9]*\.[0-9]*/'$LAN_ADDR'/g' $CFG_PATH
          fi
          # 添加 luci-app-timecontrol（add_timecontrol）
          timecontrol_dir="./package/luci-app-timecontrol"
          rm -rf "$timecontrol_dir" 2>/dev/null
          git clone --depth 1 https://github.com/sirpdboy/luci-app-timecontrol.git "$timecontrol_dir"
          # 添加 openwrt-gecoosac（add_gecoosac）
          gecoosac_dir="./package/openwrt-gecoosac"
          rm -rf "$gecoosac_dir" 2>/dev/null
          git clone --depth 1 https://github.com/lwb1978/openwrt-gecoosac.git "$gecoosac_dir"

      - name: 构建固件
        run: |
          export BASE_PATH=$(pwd)
          cp -f "$CONFIG_FILE" "./.config"
          make defconfig
          if grep -qE "^CONFIG_TARGET_x86_64=y" "$CONFIG_FILE"; then
            DISTFEEDS_PATH="./package/emortal/default-settings/files/99-distfeeds.conf"
            if [ -d "${DISTFEEDS_PATH%/*}" ] && [ -f "$DISTFEEDS_PATH" ]; then
              sed -i 's/aarch64_cortex-a53/x86_64/g' "$DISTFEEDS_PATH"
            fi
          fi
          TARGET_DIR="./bin/targets"
          if [[ -d $TARGET_DIR ]]; then
            find "$TARGET_DIR" -type f \( -name "*.bin" -o -name "*.manifest" -o -name "*efi.img.gz" -o -name "*.itb" -o -name "*.fip" -o -name "*.ubi" -o -name "*.tar.gz" \) -exec rm -f {} +
          fi
          make download -j$(($(nproc) * 2))
          make -j$(($(nproc) + 1)) || make -j1 V=s
          cd ./bin/packages
          tar -zcvf Packages.tar.gz ./*
          cp Packages.tar.gz ../targets/
          cd "$BASE_PATH"
          FIRMWARE_DIR="./firmware"
          rm -rf "$FIRMWARE_DIR"
          mkdir -p "$FIRMWARE_DIR"
          find "$TARGET_DIR" -type f \( -name "*.bin" -o -name "*.manifest" -o -name "*efi.img.gz" -o -name "*.itb" -o -name "*.fip" -o -name "*.ubi" -o -name "*.tar.gz" \) -exec cp -f {} "$FIRMWARE_DIR/" \;
          rm -f "./firmware/Packages.manifest" 2>/dev/null
          make clean

      - name: 获取内核版本
        run: |
          echo "KVER=$(find ./dl -maxdepth 1 -name "linux-[4-6]\.*" | sort -r | head -n 1 | grep -oE "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV
          useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
          echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV

      - name: 删除旧缓存
        run: |
          gh cache list --key ${{ inputs.runs-on || 'ubuntu-22.04'}}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          echo "========cache status========"
          echo "ccache: $(du -sh ./.ccache | cut -f 1)"
          echo "staging: $(du -sh ./staging_dir | cut -f 1)"

      - name: 输出虚拟机信息
        run: |
          echo "=============================================="
          lscpu | grep -E "name|Core|Thread"
          echo "=============================================="
          df -h
          echo "=============================================="

      - name: 准备发布简介
        run: |
          echo "云编译发布" > release_body.txt
          echo "源码：${{ github.repository }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: 12345678" >> release_body.txt
          echo "LAN地址: 192.168.31.1" >> release_body.txt
          echo "源码最近提交信息:" >> release_body.txt
          echo "${{ env.useVersionInfo }}" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest | awk -F":" '{print $NF}' | xargs -d '\n' -n5 printf "%-25s  %-25s  %-25s  %-25s  %-25s\n")" >> release_body.txt

      - name: 删除不需要的固件文件
        run: |
          rm -f ./firmware/mt7622-ram-1ddr-bl2.bin
          rm -f ./firmware/mt7622-ram-2ddr-bl2.bin
          rm -f ./firmware/openwrt-mediatek-mt7622-netgear_wax206.manifest
          rm -f ./firmware/openwrt-mediatek-mt7622-netgear_wax206-initramfs-recovery.itb

      - name: 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model || 'wax206'}}
          files: ./firmware/*.*
          body_path: ./release_body.txt

      - name: 删除旧的工作流和固件
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: Release_Redmi-AX6 plus（imm）
          retain_days: 20
          keep_minimum_runs: 5

      - name: 删除旧的发布版本
        uses: codesnas/delete-older-releases@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 5
          delete_tag_pattern: ${{ inputs.model || 'wax206'}}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
