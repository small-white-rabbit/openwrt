name: Release_wax206
run-name: Release - ${{ inputs.model || 'wax206'}}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        default: wax206
      runs-on:
        required: true
        description: Runs on...
        default: ubuntu-22.04

  schedule:
    - cron: 43 3 * * 4

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on || 'ubuntu-22.04'}}

    steps:
      - name: 最大化构建空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi `docker images -q`
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -y install dos2unix libfuse-dev clang ninja-build
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: 额外清理磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 清理旧缓存
        run: |
          rm -rf ./.ccache ./staging_dir

      - name: 初始化值
        run: |
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export MODEL="${{ inputs.model || 'wax206' }}"
          export CONFIG_FILE="./config/${MODEL}.config"
          if [[ -z "$MODEL" ]]; then
            echo "错误：未指定型号"
            exit 1
          fi
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "错误：配置文件 $CONFIG_FILE 不存在"
            exit 1
          fi
          echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV

      - name: 调试 feeds 和配置
        run: |
          echo "===== 检查 feeds.conf ====="
          cat ./feeds.conf || echo "feeds.conf 未找到"
          echo "===== 检查 feeds.conf.default ====="
          cat ./feeds.conf.default || echo "feeds.conf.default 未找到"
          echo "===== 检查重复 feed 名称 ====="
          awk '{print $2}' ./feeds.conf.default | sort | uniq -d || echo "无重复 feed 名称"
          echo "===== 检查 config/${MODEL}.config ====="
          cat "$CONFIG_FILE" || echo "配置文件 ${CONFIG_FILE} 未找到"
          echo "===== 检查 Rust 包 Makefile ====="
          cat ./feeds/packages/lang/rust/Makefile || echo "Rust Makefile 未找到"
          echo "===== 检查启用的软件包 ====="
          grep "CONFIG_PACKAGE_" "$CONFIG_FILE" | grep "=y" || echo "未找到启用的软件包"
          echo "===== 检查 OpenClash 配置 ====="
          grep "CONFIG_PACKAGE_luci-app-openclash" "$CONFIG_FILE" || echo "OpenClash 未配置"
          echo "===== 检查 GCC 和 Binutils 配置 ====="
          grep "CONFIG_GCC_VERSION" "$CONFIG_FILE" || echo "GCC 版本未配置"
          grep "CONFIG_GCC_USE_DEFAULT_VERSION" "$CONFIG_FILE" || echo "GCC 默认版本未配置"
          grep "CONFIG_BINUTILS_VERSION" "$CONFIG_FILE" || echo "Binutils 版本未配置"
          echo "===== 检查工具链 GCC 版本 ====="
          if [ -d "./staging_dir/toolchain-"* ]; then
            ./staging_dir/toolchain-*/bin/gcc --version || echo "GCC 未找到"
          else
            echo "工具链目录未找到"
          fi

      - name: 更新 feeds
        run: 
          ./scripts/feeds update -a
          ./scripts/feeds install -a 
 

      - name: 修复 Rust 编译和 GCC 版本
        run: |
          # 修复 Rust 编译
          echo "RUSTFLAGS=--cfg=llvm.download-ci-llvm=\"if-unchanged\"" >> $GITHUB_ENV
          if [ -f "./feeds/packages/lang/rust/Makefile" ]; then
            sed -i 's/llvm\.download-ci-llvm = true/llvm.download-ci-llvm = if-unchanged/g' ./feeds/packages/lang/rust/Makefile
          fi
          # 禁用不必要的 Rust 依赖包，保留 OpenClash
          if [ -f "$CONFIG_FILE" ]; then
            echo "CONFIG_PACKAGE_rust=n" >> "$CONFIG_FILE"
            echo "CONFIG_PACKAGE_mosdns=n" >> "$CONFIG_FILE"
            echo "CONFIG_PACKAGE_sing-box=n" >> "$CONFIG_FILE"
            # 强制 GCC 和 Binutils 版本
            echo "CONFIG_GCC_VERSION=\"13.3.0\"" >> "$CONFIG_FILE"
            echo "CONFIG_GCC_USE_DEFAULT_VERSION=n" >> "$CONFIG_FILE"
            echo "CONFIG_TOOLCHAINOPTS=y" >> "$CONFIG_FILE"
            echo "CONFIG_BINUTILS_VERSION_2_42=y" >> "$CONFIG_FILE"
            echo "CONFIG_BINUTILS_VERSION=\"2.42\"" >> "$CONFIG_FILE"
          fi
          # 强制工具链版本
          if [ -f "./toolchain/gcc/Makefile" ]; then
            sed -i 's/GCC_VERSION:=.*/GCC_VERSION:=13.3.0/g' ./toolchain/gcc/Makefile
          fi
          if [ -f "./toolchain/binutils/Makefile" ]; then
            sed -i 's/BINUTILS_VERSION:=.*/BINUTILS_VERSION:=2.42/g' ./toolchain/binutils/Makefile
          fi

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ./.ccache
            ./staging_dir
          key: ${{ inputs.runs-on || 'ubuntu-22.04'}}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ inputs.runs-on || 'ubuntu-22.04'}}-

      - name: 刷新缓存
        run: |
          if [ -d "./staging_dir" ]; then
            find "./staging_dir" -type d -name "stamp" -not -path "*target
